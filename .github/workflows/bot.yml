
name: Telegram Bot High-Performance Runner

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # ബോട്ട് നിന്നുപോകാതിരിക്കാൻ കൃത്യമായ ഇടവേളകളിൽ റൺ ചെയ്യും

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # ടൈം ഔട്ട് പ്രശ്നങ്ങൾ ഒഴിവാക്കാൻ കൂടിയ ടൈം സെറ്റ് ചെയ്തിരിക്കുന്നു

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install FFmpeg and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Telegram Bot Continuously
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      run: |
        python main.py
